<text x="830" y="318" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle">Your analysis runs here,</text>
<text x="830" y="336" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">with dedicated cores</text>
<text x="830" y="354" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">and memory</text>
