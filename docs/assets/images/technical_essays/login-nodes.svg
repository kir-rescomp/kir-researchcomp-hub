<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" role="img" aria-labelledby="title desc">
<title id="title">How you reach the compute nodes through the login nodes</title>
<desc id="desc">You connect from your own computer by ssh with two-factor authentication and arrive on one of the login nodes cluster1 to cluster4. From there you submit jobs to the Slurm scheduler, which runs them on compute nodes. Login and compute nodes share the same storage.</desc>
<rect x="1" y="1" width="958" height="564" rx="14" fill="#F5F8FC" stroke="#C9D6E6" stroke-width="2"/>
<rect x="275" y="44" width="140" height="30" rx="15" fill="#C9861A"/>
<text x="345" y="64" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">You arrive here</text>
<path d="M337,74 L353,74 L345,84 Z" fill="#C9861A"/>
<text x="115" y="116" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="1.5">YOUR COMPUTER</text>
<text x="345" y="116" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="1.5">LOGIN NODES</text>
<text x="590" y="116" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="1.5">SCHEDULER</text>
<text x="830" y="116" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="1.5">COMPUTE NODES</text>
<rect x="70" y="172" width="90" height="62" rx="7" fill="#FFFFFF" stroke="#002147" stroke-width="3"/><rect x="78" y="180" width="74" height="46" rx="3" fill="#E6EDF5"/><text x="88" y="204" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#002147" text-anchor="start">$ _</text><path d="M52,240 H178 L168,253 H62 Z" fill="#002147"/>
<text x="115" y="285" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">University network</text>
<text x="115" y="303" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">or VPN required</text>
<text x="220" y="200" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#002147" text-anchor="middle">ssh</text>
<line x1="182" y1="212" x2="256" y2="212" stroke="#4B6E9A" stroke-width="3"/><path d="M254,205 L266,212 L254,219 Z" fill="#4B6E9A"/>
<text x="220" y="236" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5B6E" text-anchor="middle">+ two-factor</text>
<text x="220" y="252" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5B6E" text-anchor="middle">authentication</text>
<rect x="270" y="134" width="150" height="196" rx="10" fill="#E6EDF5" stroke="#002147" stroke-width="2.5"/>
<rect x="288" y="150" width="114" height="32" rx="5" fill="#FFFFFF" stroke="#4B6E9A" stroke-width="1.5"/>
<text x="345" y="171" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#002147" text-anchor="middle">cluster1</text>
<rect x="288" y="192" width="114" height="32" rx="5" fill="#FFFFFF" stroke="#4B6E9A" stroke-width="1.5"/>
<text x="345" y="213" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#002147" text-anchor="middle">cluster2</text>
<rect x="288" y="234" width="114" height="32" rx="5" fill="#FFFFFF" stroke="#4B6E9A" stroke-width="1.5"/>
<text x="345" y="255" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#002147" text-anchor="middle">cluster3</text>
<rect x="288" y="276" width="114" height="32" rx="5" fill="#FFFFFF" stroke="#4B6E9A" stroke-width="1.5"/>
<text x="345" y="297" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#002147" text-anchor="middle">cluster4</text>
<text x="345" y="356" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4A5B6E" text-anchor="middle">[user@cluster1 ~]$</text>
<text x="345" y="388" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle">Shared by everyone at once:</text>
<text x="345" y="406" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">prepare and submit work here,</text>
<text x="345" y="424" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#B03A2E" text-anchor="middle">do not run analyses here</text>
<text x="472" y="200" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle">submit a job</text>
<line x1="428" y1="212" x2="509" y2="212" stroke="#4B6E9A" stroke-width="3"/><path d="M507,205 L519,212 L507,219 Z" fill="#4B6E9A"/>
<text x="472" y="236" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4A5B6E" text-anchor="middle">sbatch / srun</text>
<rect x="525" y="152" width="130" height="120" rx="10" fill="#FFFFFF" stroke="#002147" stroke-width="2.5"/>
<text x="590" y="180" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#002147" text-anchor="middle">Slurm</text>
<rect x="543" y="196" width="20" height="26" rx="3" fill="#E6EDF5" stroke="#4B6E9A" stroke-width="1.5"/>
<rect x="567" y="196" width="20" height="26" rx="3" fill="#E6EDF5" stroke="#4B6E9A" stroke-width="1.5"/>
<rect x="591" y="196" width="20" height="26" rx="3" fill="#E6EDF5" stroke="#4B6E9A" stroke-width="1.5"/>
<rect x="615" y="196" width="20" height="26" rx="3" fill="#002147" stroke="#4B6E9A" stroke-width="1.5"/>
<text x="590" y="250" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5B6E" text-anchor="middle">job queue</text>
<text x="590" y="298" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">Decides where and</text>
<text x="590" y="316" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">when each job runs,</text>
<text x="590" y="334" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">sharing resources fairly</text>
<text x="697" y="200" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#002147" text-anchor="middle">runs on</text>
