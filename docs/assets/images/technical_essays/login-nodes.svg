<rect x="270" y="468" width="650" height="46" rx="10" fill="#FFFFFF" stroke="#002147" stroke-width="2.5"/>
<path d="M292,481 V499 A14,4 0 0 0 320,499 V481" fill="#E6EDF5" stroke="#002147" stroke-width="1.8"/><ellipse cx="306" cy="481" rx="14" ry="4" fill="#FFFFFF" stroke="#002147" stroke-width="1.8"/>
<text x="600" y="496" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#002147" text-anchor="middle">Shared storage: the same files on every node</text>
<text x="595" y="540" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">Input prepared on a login node is read by your job; results are written back to the same storage.</text>
