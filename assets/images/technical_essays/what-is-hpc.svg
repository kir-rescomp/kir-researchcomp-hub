<text x="655" y="234" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#002147" text-anchor="middle">Compute nodes: each one a powerful server</text>
<text x="655" y="254" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">Dozens of cores and hundreds of GB of memory each; some also have GPUs</text>
<circle cx="583" cy="273" r="4" fill="#4FB38A"/><text x="593" y="278" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5B6E" text-anchor="start">CPU node</text>
<circle cx="676" cy="273" r="4" fill="#C9861A"/><text x="686" y="278" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#4A5B6E" text-anchor="start">GPU node</text>
<rect x="429.0" y="296" width="452" height="8" rx="4" fill="#4B6E9A"/>
<line x1="655" y1="304" x2="655" y2="342" stroke="#4B6E9A" stroke-width="3"/>
<text x="669" y="326" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="start">High-speed network linking every node</text>
<path d="M580,352 V398 A75,13 0 0 0 730,398 V352" fill="#E6EDF5" stroke="#002147" stroke-width="2.5"/>
<ellipse cx="655" cy="352" rx="75" ry="13" fill="#FFFFFF" stroke="#002147" stroke-width="2.5"/>
<text x="655" y="388" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#002147" text-anchor="middle">Shared storage</text>
<text x="655" y="436" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5B6E" text-anchor="middle">The same files are visible from every node (home directory, /well group space)</text>
<rect x="30" y="462" width="900" height="56" rx="10" fill="#002147"/>
<text x="480" y="486" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">A cluster is not simply a faster laptop. Its strength is running many jobs at the same time,</text>
<text x="480" y="506" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF" text-anchor="middle">and running jobs that need more cores or memory than a single computer can offer.</text>
</svg>
