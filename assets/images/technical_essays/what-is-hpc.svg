<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">A laptop compared with an HPC cluster</title>
<desc id="desc">A laptop is one computer with a few cores. An HPC cluster is many powerful compute nodes, some with GPUs, linked by a high-speed network and sharing the same storage.</desc>
<rect x="1" y="1" width="958" height="538" rx="14" fill="#F5F8FC" stroke="#C9D6E6" stroke-width="2"/>
<text x="160" y="58" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="1.5">YOUR LAPTOP</text>
<rect x="85" y="92" width="150" height="100" rx="7" fill="#FFFFFF" stroke="#002147" stroke-width="3"/><rect x="93" y="100" width="134" height="84" rx="3" fill="#E6EDF5"/><text x="103" y="124" font-family="'Roboto Mono', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#002147" text-anchor="start">$ _</text><path d="M67,198 H253 L243,211 H77 Z" fill="#002147"/>
<text x="160" y="252" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#002147" text-anchor="middle">One computer</text>
<text x="160" y="278" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1B2A3A" text-anchor="middle">4–16 CPU cores</text>
<text x="160" y="300" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#1B2A3A" text-anchor="middle">8–32 GB of memory</text>
<text x="160" y="330" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#4A5B6E" text-anchor="middle">Programs run directly,</text>
<text x="160" y="350" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#4A5B6E" text-anchor="middle">as soon as you start them</text>
<text x="337" y="160" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#4B6E9A" text-anchor="middle">scale out</text>
<line x1="300" y1="175" x2="365" y2="175" stroke="#4B6E9A" stroke-width="3"/><path d="M363,168 L375,175 L363,182 Z" fill="#4B6E9A"/>
